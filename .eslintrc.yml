---
env:
  commonjs: true
  es2021: true
  node: true
extends: standard
parserOptions:
  ecmaVersion: latest
rules:
  require-await:
    - error
  no-console:
    - error
  newline-after-var:
    - error
    - always
  comma-dangle:
    - error
    - always-multiline
  no-unused-vars:
    - error
    - vars: all
      args: after-used
      argsIgnorePattern: _
      ignoreRestSiblings: true
